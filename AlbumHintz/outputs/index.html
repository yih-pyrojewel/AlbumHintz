<section class="info-panel" id="info-panel" hidden aria-modal="true" role="dialog" aria-label="关于 AlbumHintz"><div class="info-copy"><h2>AlbumHintz</h2><p>一个为犹豫时刻准备的音乐入口。</p><p>选择音乐语言、输入 genre 与年份，AlbumHintz 会从 MusicBrainz 的专辑资料中为你挑出一张值得现在播放的作品。</p><p>它保留一点随机，也保留你随时换一张的自由。</p><p>欢迎在 <a href="https://github.com/yih-pyrojewel" target="_blank" rel="noreferrer">GitHub 的 yih-pyrojewel</a> 反馈想法与问题。</p><button class="info-close" id="info-close" type="button" aria-label="关闭简介">×</button></div></section></main><script>
const $=id=>document.getElementById(id);let tags=[],selected='',busy=false,region='intl',queue=[],modeResults={intl:null,chinese:null};const search=$('search'),matches=$('matches');
function matchList(){const raw=search.value.trim(),q=raw.toLowerCase(),choices=tags.filter(t=>t.toLowerCase().includes(q)).slice(0,12);const direct=raw&&!choices.some(t=>t.toLowerCase()===q)?`<button class="match" data-tag="${raw}">搜索 “${raw}”</button>`:'';matches.innerHTML=choices.map(t=>`<button class="match" data-tag="${t}">${t}</button>`).join('')+direct;matches.classList.toggle('show',!!q);matches.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>choose(b.dataset.tag))}
function setRegion(next){if(next===region)return;const direction=next==='chinese'?'slide-right':'slide-left';region=next;queue=[];document.body.classList.toggle('chinese',region==='chinese');document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.region===region));const saved=modeResults[region];if(saved)showAlbum(saved.album,saved.genre,direction);else showPlaceholder(direction)}

let ambientFront='ambient-art';function setAtmosphere(url){const front=$(ambientFront),next=$(ambientFront==='ambient-art'?'ambient-art-next':'ambient-art'),rect=$('cover').getBoundingClientRect(),x=(rect.left+rect.width/2)/innerWidth*100+'%',y=(rect.top+rect.height/2)/innerHeight*100+'%';next.style.setProperty('--vanish-x',x);next.style.setProperty('--vanish-y',y);next.style.backgroundImage='url("'+url.replace(/"/g,'%22')+'")';requestAnimationFrame(()=>{next.classList.add('visible');front.classList.remove('visible');ambientFront=next.id})}

function animateResult(direction){const result=$('result');result.classList.remove('slide-left','slide-right');if(!direction)return;void result.offsetWidth;result.classList.add(direction);setTimeout(()=>result.classList.remove(direction),460)}
function showPlaceholder(direction){const result=$('result'),cover=$('cover'),shell=$('cover-shell');cover.onload=null;cover.onerror=null;cover.alt='';cover.removeAttribute('src');shell.classList.remove('loading');result.classList.add('placeholder');result.hidden=false;$('ambient-art').classList.remove('visible');$('ambient-art-next').classList.remove('visible');$('genre').textContent='';$('album').textContent='';$('artist').textContent='';$('year').textContent='';$('score').textContent='';$('hint').textContent=region==='chinese'?'华语音乐模式':'欧美音乐模式';animateResult(direction)}
function showAlbum(a,genre,direction=''){const cover=$('cover'),shell=$('cover'),result=$('result');let triedFallback=false;result.classList.remove('placeholder');cover.onload=null;cover.onerror=null;cover.removeAttribute('src');cover.classList.remove('in','sharp');cover.style.background='linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08))';shell.classList.add('loading');cover.alt=a.title+' 专辑封面';cover.onload=()=>{shell.classList.remove('loading');cover.classList.add('sharp');setAtmosphere(cover.currentSrc||cover.src)};cover.onerror=()=>{if(!triedFallback&&a.cover_fallback){triedFallback=true;cover.src=a.cover_fallback;return}shell.classList.remove('loading');cover.removeAttribute('src');cover.style.background='linear-gradient(135deg,#dadde6,#aab4c4)'};cover.src=a.cover;$('genre').textContent=genre;$('album').textContent=a.title;$('artist').textContent=a.artist;$('year').textContent=a.year;critic('pitchfork',a.pitchfork);critic('fantano',a.fantano);$('score').textContent='';$('apple').href=musicLink('apple',a);$('spotify').href=musicLink('spotify',a);$('douban').href=a.musicbrainz;result.hidden=false;modeResults[region]={album:a,genre};$('hint').textContent=region==='chinese'?'华语音乐模式':'欧美音乐模式';animateResult(direction)}
async function pick(){if(!selected||busy)return;if(queue.length){showAlbum(queue.shift(),selected);return}busy=true;$('next').disabled=true;$('picking-progress').hidden=false;$('hint').textContent='正在挑选…';try{const f=filterValues(),u='/api/pick?genre='+encodeURIComponent(selected)+'&min='+f.rmin+'&max='+f.rmax+'&year_min='+f.ymin+'&year_max='+f.ymax+'&region='+region;const res=await fetch(u),p=await res.json();if(!res.ok)throw Error(p.error||'请求失败');queue=p.queue||[];showAlbum(p.album,p.genre);preload(queue)}catch(e){$('hint').textContent=e.message}finally{$('picking-progress').hidden=true;busy=false;$('next').disabled=false}}
async function init(){if(location.protocol==='file:'){$('hint').innerHTML='请先启动服务，再打开 <a href="http://127.0.0.1:8787">127.0.0.1:8787</a>';return}try{const r=await fetch('/api/genres'),p=await r.json();if(!r.ok)throw Error(p.error||'读取标签失败');tags=p.genres;search.disabled=false;$('hint').textContent='已加载 '+tags.length+' 个 MusicBrainz 标签'}catch(e){$('hint').textContent='无法连接本地服务：请用 python3 server.py 启动'}}
search.oninput=matchList;search.onkeydown=e=>{if(e.key==='Enter')runSearch()};document.addEventListener('click',e=>{if(!e.target.closest('.search-zone'))matches.classList.remove('show')});$('search-button').onclick=runSearch;$('next').onclick=pick;$('info-button').onclick=()=>toggleInfo(true);$('info-close').onclick=()=>toggleInfo(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleInfo(false)});['year-min','year-max'].forEach(id=>$(id).oninput=()=>{queue=[]});document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setRegion(b.dataset.region));init();
</script></body></html>
